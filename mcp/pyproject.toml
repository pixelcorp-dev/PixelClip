[project]
name = "pixelclip-mcp"
version = "0.1.0"
description = "Model Context Protocol server for PixelClip — turn long videos into viral short clips."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "PixelClip" }]
keywords = ["mcp", "pixelclip", "video", "clips", "ai"]
dependencies = [
    "mcp[cli]>=1.30.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.scripts]
pixelclip-mcp = "pixelclip_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixelclip_mcp"]
